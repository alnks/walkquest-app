[versions]
# Toolchain: AGP 8.13.2 — максимум линии 8.x и потолок полной поддержки KGP 2.3.x
# (AGP 9 требует built-in Kotlin и не даёт держать пин Kotlin из spine).
agp = "8.13.2"
kotlin = "2.3.21"           # spine Stack (линия 2.3.x); последний багфикс линии, проверено 2026-10-07. 2.4.x несовместим с пином AGP 8.13.2: Kotlin 2.4 требует R8 9.1.29 (поставляется с AGP 9.1+) — ломает release minify (AD-8)
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2025.11.01"   # Compose 1.9.5 + material3 1.4.0 — последняя линия, совместимая с AGP 8.13.2 (1.10+/2025.12+ требуют AGP 9)
maplibre = "13.5.2"         # AD-1, линия 13.5.x, Vulkan; проверено в maven-metadata 2026-10-01
coroutines = "1.11.0"
junit = "4.13.2"
kotlinxSerializationJson = "1.11.0"  # последний стабильный в Maven Central, проверено 2026-10-04

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
