[[entry]]
id = 5
type = "story"
title = "Задания (FR-16): пул 22, раздача, активное, замена, выполнение"
description = "domain/quests: QuestDef (22 из каталога как данные), QuestPool — случайная раздача и выбор из 6 (без весов v1; балансировка по отказам — после запуска, каталог), QuestStateStore (quests.json: активное задание, выполненные osm_id, счётчик выполненных, счётчик отказов). Одно активное за раз; взятие поверх активного — подтверждающий диалог «У вас уже есть задание» («Взять новое / Оставить текущее»), прежнее снимается без штрафа. Выполнение — нажатием «Выполнено» (честное слово); отказ — «Снять задание» без штрафа. Кнопку задания можно скрыть в настройках (showQuestButton, default true). Карточка активного задания на экране карты во время прогулки."
verify = "JVM: пул 22 уникален; раздача случайная/из-6 из полного пула; один активный; замена снимает без штрафа (счётчик отказов растёт, выполненные не трогаются); выполнение растит счётчик; настройка скрытия персистится. UI: карточка видна в прогулке, диалог замены работает."
covers = ["FR-16"]
after = []
hitl = false
risk = "medium"
references = ["content — content-catalog.md, Задания (22) и правила пула", "prd — раздел 4.5 (FR-16)"]

