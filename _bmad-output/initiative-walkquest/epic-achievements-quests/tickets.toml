[[entry]]
id = 2
type = "story"
title = "Движок достижений (domain): каталог 40 + выдача и задним числом"
description = "domain/achievements: AchievementDef (id, значок, название, условие-текст, rare, hasProgress) — каталог всех 40 из content-catalog как данные. AchievementState: собирается из WalkHistory (даты/время/дистанции/regionIds/modes), ComputeRegionProgress (доля домашнего города), PoiCardStore (число прочтений, парки), DistrictProgress (4.3), QuestCounters (4.5). AchievementEngine.evaluate(state): список вновь выполненных (условия — data-class'ы условий, тестируемо поодиночке). EarnedStore (achievements/earned.json): полученные id + когда; проверка после каждой завершённой прогулки (сервис) И полная перепроверка по истории (задним числом, FR-15) на старте. D4/D5 (рейтинг/приглашения) НЕ входят — нужен Supabase, отложены в epic-leaderboard (Decision)."
verify = "JVM: каждое условие (38 в движке v1) — граничные случаи; evaluate идемпотентен против EarnedStore; перепроверка по истории выдаёт задним числом; новые достижения из 'обновления приложения' (добавление def'а) проверяются по истории."
covers = ["FR-15"]
after = [1]
hitl = false
risk = "high"
references = ["content — content-catalog.md, весь раздел Достижения", "prd — раздел 4.4 (FR-15)"]

[[entry]]
id = 3
type = "story"
title = "Районный и городской прогресс (A2–A6, A8–A10, E2)"
description = "domain/DistrictProgressCalculator: для региона — по boundaries.geojson (kind=district, что есть в пакете) считает для каждого района долю открытых проходимых клеток (центр клетки в полигоне района, bbox-префильтр + PointInPolygon); полностью открытый = доля 1.0. Город = домашний регион: доля из ComputeRegionProgress. Малые города без kind=district — районные достижения скрываются (спек: в малых городах районных достижений нет). Фикс генератора region-pack (сейчас kind=district — форты Кронштадта вместо 18 районов СПб) — отдельная задача tools, здесь движок generic."
verify = "JVM: районный подсчёт на синтетической сетке и полигонах (квадратный район, клетки на границе); город без районов → пустой список (достижения скрыты); доля 1.0 засчитывается."
covers = ["FR-15"]
after = [1]
hitl = false
risk = "high"
references = ["content — content-catalog.md, модель территории", "architecture — AD-9"]

