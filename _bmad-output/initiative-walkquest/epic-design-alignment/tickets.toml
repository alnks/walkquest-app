# tickets.toml — стори эпика «Сведение дизайна экранов к утверждённым макетам».
# Порядок таблиц = порядок сборки (задан владельцем): онбординг → финал → профиль →
# остальные по заметности расхождений → карта в конце. Одна стори = один экран.

[[entry]]
id = 1
type = "story"
title = "Онбординг по макету (4 шага, иллюстрация, точки)"
description = "Пересобирает OnboardingOverlay по mockups/onboarding-duo.html и EXPERIENCE: приветствие с иллюстрацией-туманом и точками шагов, шаг выбора домашнего региона, цель со степпером, экран доступа к геолокации; обучение непропускаемо, «Пропустить» ведёт к цели. Токены/компоненты — через ui-ux-pro-max."
verify = "Эмулятор: чистая установка показывает 4 шага с иллюстрацией и точками; сверка 04-onboarding в compare даёт «совпадает»; тесты и compileDebugKotlin зелёные."
covers = ["AL-1"]
after = []
hitl = false
risk = "medium"
references = ["ux-walkquest/mockups/onboarding-duo.html", "ux-walkquest/screens-spec.md#§4"]

