# tickets.toml — стори эпика «Сведение дизайна экранов к утверждённым макетам».
# Порядок таблиц = порядок сборки. Шаг 0 (7.15) — аудит дизайн-системы, дальше заданный
# владельцем порядок экранов: онбординг → финал → профиль → остальные по заметности →
# карта последними экранными. Одна стори = один экран; в каждой — сверка иконок и их
# цветов. Замыкают эпик sweep (7.13) и полная повторная сверка (7.14).

