# tickets.toml — истории эпика epic-habits в порядке сборки. Порядок таблиц = порядок работ.
#
# СТАТУС НА 2026-10-09: вся кодовая часть завершена (3.1–3.7), 336 JVM-тестов
# зелёных принудительным перезапуском, assembleRelease PASS. Детали: deferred-work.md.
# Полевые прогоны (доставка уведомлений 3.5/3.6, сценарии) — отложены владельцем
# общим решением о паузе полевой работы; формальное закрытие эпика — после них.
#
# Нарезка — 2026-10-09 (инсепшн эпика 3, после code complete epic-walk-tracking).
# Фундамент: завершённая прогулка (эпик 2) — серии, статистика и цель строятся
# на истории прогулок, источник истины — устройство (FR-13).

[[entry]]
id = 1
