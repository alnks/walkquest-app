title = "Планировщик прогулок (FR-17)"
description = "Запланированная прогулка: дата+время, напоминание за 15 минут (default, настраивается planReminderLeadMinutes 5..120), работает без цели и с целью. data: хранилище планов plans/plans.json (список, атомарная запись). Планировка: AlarmManager exact на (время − lead); приёмник шлёт тихое напоминание «Пора собираться: прогулка в HH:MM». Выполненность плана подтверждается фактом любой прогулки в тот день (пометка done по истории 3.1, без наказания и без влияния на серию — FR-17)."
verify = "JVM: хранилище планов round-trip/удаление; политика «прогулка в день плана = план выполнен». Устройство/эмулятор: напоминание приходит за lead минут; пропуск плана не трогает серию (JVM-регрессия)."
