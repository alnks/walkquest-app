title = "История завершённых прогулок (data + domain)"
description = "data: append-only хранилище записей прогулок walks/walks.jsonl (каждая завершённая сессия — запись {sessionId, startedAt, finishedAt, distanceMeters, activeMillis, acceptedCount}; append+fsync как журнал AD-5). domain: WalkHistory — чтение списка, агрегаты (число прогулок, суммарная дистанция) и выборка «прогулки за неделю» (неделя — локальный календарь устройства, пн–вс). Сервис дописывает запись при finish сессии (после persistSession в stopRecording). Снимок session/session.json остаётся для восстановления — не дублирует историю."
