[[entry]]
id = 3
type = "story"
title = "Вступительное обучение (FR-12) + постановка цели при регистрации"
description = "Онбординг первого запуска: ≤4 экранов (что такое Туман; как открывается карта прогулкой; Режимы и правило лимита скорости — почему самокат в пешем режиме не засчитается; выбор Цели — тип + значение). Пропускаемый (кнопка «Пропустить»), показывается до первой прогулки (флаг onboardingDone в настройках; без цели онбординг не считается завершённым — FR-11 «обязательна к выбору», пропуск обучения НЕ освобождает от цели: после пропуска показываем только экран цели). Тексты — по EXPERIENCE/прототипу (ob1–ob4), голос спокойный."
verify = "Первый запуск: 4 экрана, листание вперёд/назад, «Пропустить» → экран цели → завершение; повторный запуск онбординг не показывает. JVM: флаг/цель персистятся, состояние «обучение пропущено, цель есть» корректно."
covers = ["FR-12", "FR-11"]
after = [2]
hitl = false
risk = "medium"
references = ["prd — _bmad-output/initiative-walkquest/prd-walkquest/prd-walkquest.md, FR-12 (Consequences), FR-11", "ux — _bmad-output/initiative-walkquest/ux-walkquest/EXPERIENCE.md, прототип ob1–ob4"]

