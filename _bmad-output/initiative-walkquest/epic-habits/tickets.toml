[[entry]]
id = 5
type = "story"
title = "Умные напоминания по цели (FR-14)"
description = "domain: GoalReminderPolicy — проверка отставания от цели (прогулки в неделю: факт недели из истории vs цель; минуты/км в день: сегодняшний факт vs цель — для v1 сравнение по сегодняшнему дню, недельное накопление — к калибровке в поле) → решение ReminderDue/None + текст («неделя подходит к концу, а до плана 2 прогулки. Погуляем?» — варианты по типу цели). Планировка: AlarmManager на вечерний час (default 19:00, настраивается goalReminderHour 0..23) — приёмник считает отставание и шлёт тихое уведомление ТОЛЬКО при отставании (FR-14); отдельная настройка goalRemindersEnabled (default true), независимая от уведомлений трекинга. Пропуск дня не наказывается (серия — отдельная механика 3.4)."
verify = "JVM: политика — нет отставания → None; отставание по каждому типу цели → ReminderDue с корректным текстом/числом; отключение настройки → None. Устройство/эмулятор: вечернее напоминание приходит только при отставании."
covers = ["FR-14"]
after = [2, 4]
hitl = false
risk = "medium"
references = ["prd — _bmad-output/initiative-walkquest/prd-walkquest/prd-walkquest.md, FR-14 (Consequences)"]

[[entry]]
