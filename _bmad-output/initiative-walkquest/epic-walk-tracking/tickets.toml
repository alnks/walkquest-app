description = "15 минут неподвижности → автопауза (запись координат приостановлена, агрегаты считают чистое время); движение → автоматическое возобновление. Неподвижность определяется в tracking по потоку отфильтрованных точек (нет валидных перемещений N минут — тюнер). Автопауза отключается в настройках; состояние паузы видно в уведомлении и на экране карты."
verify = "JVM: детектор неподвижности (границы таймаута, отклейка GPS-шума — неподвижность не ломается мелкими джиттер-фиксами), возобновление по движению, настройка отключения. Debug-сборка: симуляция сценария «остановка 15 минут → пошёл» через TrackSimulation воспроизводит паузу и возобновление."
covers = ["FR-7"]
after = [1]
hitl = false
risk = "medium"
references = ["prd — _bmad-output/initiative-walkquest/prd-walkquest/prd-walkquest.md, FR-7 (Consequences)"]

