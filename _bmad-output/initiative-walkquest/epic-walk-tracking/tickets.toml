# tickets.toml — истории эпика epic-walk-tracking в порядке сборки. Порядок таблиц = порядок работ.
#
# Нарезка — 2026-10-09 (инсепшн эпика 2, после закрытия epic-map-foundation).
# База от эпика 1: foreground-сервис прототипа (1.7), append-only журнал (AD-5),
# PointFilter с лимитом скорости, TrackSimulation (1.15), debug-оверлей (1.14).
#
# СТАТУС:
# 2.1 — code complete 2026-10-09 (WalkSession + WalkSessionStore + восстановление в сервисе
#       + агрегаты в шине/UI; 242 JVM-теста зелёные, assembleRelease PASS). Полевой пункт
#       verify (убийство процесса на устройстве) — в гейте 2.9.
# 2.2 — code complete 2026-10-09 (WalkMode + SpeedLimitPolicy + updateLimit фильтра
#       + ACTION_SET_MODE + переключатель режима; 252 JVM-теста зелёные, assembleRelease PASS).
# 2.3 — spike, ждёт полевых прогонов владельца (HITL).
# 2.4 — code complete 2026-10-09 (MotionPauseTracker + пауза/возобновление сессии
#       в сервисе + настройка и переключатель автопаузы; 261 JVM-тест зелёный,
#       assembleRelease PASS). Напоминание о забытой прогулке — 2.5.
# 2.5 — code complete 2026-10-09 (ReminderDue второго окна + уведомление с действиями
#       «Продолжить»/«Завершить» + настройка; 266 JVM-тестов зелёных, assembleRelease PASS).
# 2.6 — code complete 2026-10-09 (BatteryGuard 15%/10% + тихое предупреждение +
#       автозавершение через штатный стоп; 276 JVM-тестов зелёных, assembleRelease PASS).
# 2.7 — code complete 2026-10-09 (троттлер прогресс-уведомлений 5 мин + прогресс-текст
#       в уведомлении; 284 JVM-теста зелёных, assembleRelease PASS).
# 2.8 — code complete 2026-10-09 (порт ачивок + WalkPraise + сводка FINISHED + оверлей
#       результатов + ACTION_SEND; 288 JVM-тестов зелёных, assembleRelease PASS).
# 2.9 — полевой гейт (HITL): 6 часов фона, батарея, анти-чит, восстановление. ОТЛОЖЕН
#       решением владельца (вся полевая работа на паузе; симуляция не используется).
# 2.10 — done 2026-10-09 (sweep: убрана двойная публикация агрегатов, каналы унифицированы;
#        288 JVM-тестов зелёных принудительным перезапуском, assembleRelease PASS).
