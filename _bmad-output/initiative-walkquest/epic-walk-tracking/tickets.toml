[[entry]]
id = 1
type = "story"
title = "Жизненный цикл прогулки и восстановление сессии"
description = "domain/tracking: полная модель сессии прогулки — состояния active/paused/finished, ручной старт/стоп, сериализация сессии в хранилище; восстановление активной сессии после убийства процесса системой и перезапуска приложения без потери уже записанного трека (AD-5, журнал уже append-only). Агрегаты прогулки в domain: расстояние только по принятым фильтром точкам, чистое время без пауз. UI: состояние прогулки на экране карты (идёт/на паузе) и кнопка завершения."
verify = "JVM: переходы состояний сессии, сериализация/десериализация, агрегаты (расстояние/время по принятым точкам, паузы не считаются). Устройство: убийство процесса во время записи → перезапуск → сессия восстановлена, потеря — секунды, не трек; полевая проверка восстановления тропы после реального перезапуска (хвост 1.13)."
covers = ["FR-5"]
after = []
hitl = false
risk = "medium"
references = ["architecture — _bmad-output/initiative-walkquest/architecture-walkquest/architecture-walkquest.md, AD-5", "prd — _bmad-output/initiative-walkquest/prd-walkquest/prd-walkquest.md, FR-5 (Consequences)"]

[[entry]]
id = 2
type = "story"
title = "Режим прогулки и лимит скорости по режиму"
description = "Пеший (по умолчанию) и вело/самокат режимы; лимит скорости — константа режима, переключение до старта прогулки и во время неё; PointFilter применяет лимит текущего режима: участок быстрее лимита не открывает тайлы и не идёт в расстояние (FR-6). Лимиты видны и редактируются в настройках (стартовые гипотезы ~12 км/ч пеший, ~30 км/ч вело). Сценарий «самокат в пешем режиме не засчитывается» объясняется в обучении — контракт текста для epic-habits (FR-12), здесь только точка входа в настройки режима."
verify = "JVM: фильтр по обоим режимам (граничные значения лимита, смена режима в середине трека), настройки лимитов персистентны. Debug-сборка: симуляция (1.15) трека выше лимита режима не открывает тайлы и не увеличивает расстояние."
covers = ["FR-6"]
after = [1]
hitl = false
risk = "medium"
unknown = "Точные значения лимитов — стартовые гипотезы; финальные подтверждает spike 2.3 (PRD OQ-1)."
references = ["architecture — _bmad-output/initiative-walkquest/architecture-walkquest/architecture-walkquest.md, AD-5", "prd — _bmad-output/initiative-walkquest/prd-walkquest/prd-walkquest.md, FR-6 (Consequences)"]

